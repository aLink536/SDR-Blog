[package]
name = "radio-log"
version = "0.1.0"
edition = "2021"
description = "A desktop logbook for SDR listening and amateur radio."

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
directories = "6"
tempfile = "3"
fs2 = "0.4"
rfd = "0.15"

[build-dependencies]
winres = "0.1.12"

[profile.release]
lto = "thin"
strip = true
opt-level = "s"

